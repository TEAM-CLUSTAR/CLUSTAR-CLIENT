name: Auto Assign Author

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout assignment scripts
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Assign author to issue/PR
        uses: actions/github-script@v7
        with:
          script: |
            const assignAuthor = require('./.github/scripts/assign-author.js');
            await assignAuthor({ github, context });

      - name: Assign fair reviewer
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const assignReviewers = require('./.github/scripts/assign-reviewers.js');
            await assignReviewers({ github, context, core });
